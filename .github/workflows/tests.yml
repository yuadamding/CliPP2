name: CPU regression and wheel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies and test tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
      - name: Record numerical qualification environment
        run: |
          python -m pip freeze
          python -c 'import platform, sys, torch; print(sys.version); print(platform.platform()); print(torch.__config__.show())'
      - name: Lint
        run: python -m ruff check .
      - name: Regressions including isolated wheel installation and CPU fit
        run: python -m pytest -q
