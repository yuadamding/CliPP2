name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      CLIPP2_BUILD_CUDA: '0'
      CLIPP2_CPU_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and lint tool
        run: python -m pip install '.[dev]'
      - name: Build the source checkout's CPU libraries
        run: python setup.py build_ext --inplace --force
      - name: Lint
        run: python -m ruff check .
      - name: Exercise the installed command
        run: clipp2 fit --input-dir examples/tumor --device cpu --max-clusters 3 --cpu-threads 1 --output-dir '${{ runner.temp }}/clipp2-cpu-smoke'
      - name: Exercise interval fits and paired assignment
        run: python tools/qualify_workflow.py --output '${{ runner.temp }}/clipp2-qualification.json' --seed 20261105 --replicates 3 --posterior-min 0.9 --mean-deviance-max 6 --tie-atol 1e-10
