name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[test]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q cli.py api.py config.py core io model_selection reporting runners tools
      - name: Test
        run: python -m pytest -q .github/ci
      - name: Build inference wheel
        run: |
          rm -rf -- build clipp2.egg-info
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/clipp2-wheel" .
      - name: Check inference wheel
        run: python .github/ci/check_wheel.py "$RUNNER_TEMP/clipp2-wheel"
