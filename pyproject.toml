[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipp2"
dynamic = ["version"]
description = "Objective-faithful multi-region mutation prevalence clustering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.12"]
simulation = ["numpy==2.3.5; python_version >= '3.11'", "matplotlib>=3.7"]

[project.scripts]
clipp2 = "CliPP2.cli:main"
clipp2-simulate = "CliPP2.simulation.__main__:main"

[tool.setuptools]
packages = [
    "CliPP2",
    "CliPP2.io",
    "CliPP2.tree",
    "CliPP2.kernel",
    "CliPP2.simulation",
]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "CliPP2._version.__version__" }

[tool.setuptools.package-data]
CliPP2 = [
    "kernel/csrc/*.cpp",
    "kernel/csrc/*.h",
    "kernel/csrc/common/*.h",
    "kernel/csrc/cpu/*.cpp",
    "kernel/csrc/cpu/*.h",
    "kernel/csrc/cuda/*.cu",
    "kernel/csrc/cuda/*.cuh",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
